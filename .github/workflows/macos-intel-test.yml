name: Intel Mac installer validation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: macos-intel-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install source test dependencies
        run: python -m pip install -r requirements-build.txt -r config/requirements/analysis.txt
      - name: Run source tests and JavaScript checks
        run: |
          python -m unittest discover -q
          for file in src/static/*.js; do node --check "$file"; done
      - name: Prepare pinned universal publisher interpreter
        run: python installer/prepare_mac_runtime.py
      - name: Build offline universal development installer
        env:
          AWEAR_MAC_ARCH: universal2
        run: .venv-desktop-universal/bin/python src/installer_build.py mac
      - name: Validate actual Intel packaged analysis and complete recovery
        run: |
          test "$(uname -m)" = x86_64
          python installer/smoke_analysis.py --executable "$PWD/dist/MindTrail Lab.app/Contents/MacOS/MindTrail Lab" --report dist/macos-intel-native-validation.json
      - name: Verify disk image
        run: hdiutil verify dist/*Mac*unsigned.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mindtrail-macos-intel-validation
          retention-days: 7
          path: |
            dist/*Mac*unsigned.dmg
            dist/*.sha256
            dist/macos-intel-native-validation.json
