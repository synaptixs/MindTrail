name: Windows installer validation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    # Draft pull requests prepare the workflow without allocating a paid runner.
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - name: Install publisher build dependencies
        run: python -m pip install -r requirements-build.txt numpy scikit-learn
      - name: Run source and packaging tests
        run: python -m unittest discover
      - name: Check EEG JavaScript
        run: node --check src/static/eeg.js
      - name: Check first-run JavaScript
        run: node --check src/static/welcome.js
      - name: Check recording quality JavaScript
        run: node --check src/static/quality.js
      - name: Check exploration JavaScript
        run: |
          node --check src/static/explore.js
          node --check src/static/similarity.js
          node --check src/static/compare.js
      - name: Install NSIS compiler
        run: choco install nsis --yes --no-progress
      - name: Verify signing prerequisites without signing
        shell: pwsh
        run: ./installer/prepare_windows_signing.ps1
      - name: Build offline development installer
        shell: pwsh
        run: |
          $env:PATH += ';C:\Program Files (x86)\NSIS'
          ./scripts/build-windows.ps1
      - name: Verify native install, upgrade, key vault and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*Windows*x64*Setup-unsigned.exe).FullName
          python installer/smoke_windows.py --installer $setup --report dist/windows-native-validation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mindtrail-windows-validation
          retention-days: 7
          path: |
            dist/*Windows*x64*Setup-unsigned.exe
            dist/*.sha256
            dist/windows-native-validation.json
